name: Run Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        pip install -e .
        # Install all optional dependencies for testing
        pip install requests Flask aiohttp httpx starlette gunicorn

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Test package installation
      run: |
        pip install .
        python -c "import nivacloud_logging; print('Package imported successfully')"
