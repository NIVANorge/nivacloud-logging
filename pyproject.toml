[tool.poetry]
name = "nivacloud-logging"
version = "1.1.0"
description = "Utils for setting up logging used in nivacloud applications"
authors = ["Norwegian Institute for Water Research <miljoinformatikkpoetry@niva.no>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/NIVANorge/nivacloud-logging"
repository = "https://github.com/NIVANorge/nivacloud-logging"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: System :: Logging",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
packages = [{include = "nivacloud_logging"}]

[tool.poetry.dependencies]
python = ">=3.12"
python-json-logger = "4.1.0"

# Optional dependencies
requests = {version = ">=2.22.0", optional = true}
Flask = {version = ">=1.1.0", optional = true}
aiohttp = {version = ">=3.0.0", optional = true}
starlette = {version = ">=0.7.2", optional = true}
gunicorn = {version = ">=19.0.0", optional = true}

[tool.poetry.extras]
requests = ["requests"]
flask = ["Flask"]
aiohttp = ["aiohttp"]
starlette = ["starlette"]
gunicorn = ["gunicorn"]
all = ["requests", "Flask", "aiohttp", "starlette", "gunicorn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=4.4.0"
pytest-asyncio = ">=0.10.0"
requests = ">=2.22.0"
Flask = ">=1.1.0"
aiohttp = ">=3.0.0"
starlette = ">=0.7.2"
gunicorn = ">=19.0.0"
httpx = ">=0.20.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
